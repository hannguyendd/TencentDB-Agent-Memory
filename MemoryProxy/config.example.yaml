# ═══════════════════════════════════════════════════════════════════════════════
# Context Proxy - Full Configuration Reference
# ═══════════════════════════════════════════════════════════════════════════════
#
# Every field has a default; fields left unset fall back automatically. Below, the meaning and usage of each option are listed.
#
# Request handling flow:
#   client request -> auth -> sessionInit (session init: popup to pick team/agent/task)
#   -> injection (context injection: skill/memory/wiki/knowledge into the system prompt)
#   -> forward to upstream LLM -> usage/reporting -> return to client
#
# Inter-module dependencies:
#   sessionInit depends on coreSkill (pulls the team/agent/task lists from kernel 8420) + state storage
#   injection   depends on coreSkill (skill RAG injection) + tdai (memory L1/L2/L3)
#   auth        is standalone; calls kernel POST /v3/meta/auth/verify to verify apiKey -> user_id
#
# State storage backend:
#   Injection/Skill data (inj:*/sk:*/vpin:*) goes to Redis by default; with storage.enabled=true
#   it can be switched to ProxyStorage (COS/SQLite/FS/Memory). See the storage: section.
# ═══════════════════════════════════════════════════════════════════════════════


# ── Server listener ─────────────────────────────────────────────────────────────────
server:
  host: 0.0.0.0           # Listen address; 0.0.0.0 means all interfaces
  port: 8096               # Listen port
  forwardTimeoutMs: 600000 # Upstream forward timeout (ms), default 600000 (10 minutes); 0 = no timeout


# ── Upstream LLM service (default fallback) ──────────────────────────────────────────────────
upstream:
  # Upstream OpenAI-compatible API address (/v1/chat/completions is appended automatically by the proxy)
  # Full paths such as https://llm-upstream.example.com/v2/ are also supported
  url: https://tokenhub.example.com/v1
  # If non-empty, replaces Authorization: Bearer <apiKey> in all forwarded requests.
  # If left empty, the client's original API Key is passed through.
  apiKey: "<YOUR_TOKENHUB_API_KEY>"

  # ── Per-Agent overrides ─────────────────────────────────────────────────────────
  # Override url + apiKey by agent name (URL path prefix /{agent}/...).
  # The Anthropic and OpenAI protocols share the same table.
  #
  # Fallback rule (important) -- only an agent that is "not configured" falls back to the outer upstream:
  #
  #   ┌────────────────────────────────┬────────────┬───────────────────────┐
  #   │ Agent's configuration          │ url used   │ apiKey used           │
  #   ├────────────────────────────────┼────────────┼───────────────────────┤
  #   │ Not in agents                  │ upstream.url│ upstream.apiKey (fallback)│
  #   │ In agents, url only            │ agent.url  │ client request's key passed through │
  #   │ In agents, url + apiKey        │ agent.url  │ agent.apiKey          │
  #   └────────────────────────────────┴────────────┴───────────────────────┘
  #
  # The middle row is a deliberate loophole in the design: once an agent appears in this table, the outer
  # upstream.apiKey fallback is cut off, allowing operators in a single proxy to have
  # some agents use the server-side key while others pass through the client's own key.
  #
  # Full priority (high -> low):
  #   1. Credentials carried by costGuard's internal routing (cheap-model fallback)
  #   2. upstream.agents[agent].url + upstream.agents[agent].apiKey
  #   3. costGuard.anthropicUpstream.url (Anthropic protocol only)
  #   4. upstream.url + upstream.apiKey (default when no agent matches)
  agents: {}
    # claude-code:                                        # server-side key mode
    #   url: "https://claude-upstream.example.com/v1"
    #   apiKey: "sk-ant-agent-key"
    # codex:                                              # client key passthrough mode
    #   url: "https://codex-upstream.example.com/v1"
    #   # no apiKey -> pass through the key the client sends, skipping the outer fallback
    # Note: clients such as workbuddy / codebuddy / claude-code do not need a separate per-agent override;
    # their requests naturally fall to the outer upstream.url, authenticate via user_key, and the proxy automatically pulls
    # the matching team/agent/task context from the kernel by user_id (no need to create resources manually).
    # Create user assets (Team / Agent / Task / user authorization) in the MemoryPanel web panel.


# ──── Multi-client onboarding (workbuddy / codebuddy / claude-code, etc.) ───────────────────
# MemoryProxy does not manage user assets. Team / Agent / Task / user authorization are all created in the MemoryPanel Web
# panel (port 8123). Client onboarding flow:
#
#   1. The admin, in MemoryPanel:
#      - Creates a User and obtains a user_key in the sk-mem-xxx format
#      - Creates a Team and adds the user as a member
#      - Creates Agents and Tasks under the Team
#   2. Client configuration (baseUrl only needs to go up to {agent}/{spaceId}; the client SDK appends the API path automatically):
#      - Base URL: http://<proxy-host>:8096/{agent}/{spaceId}
#        e.g.: http://proxy.example.com:8096/workbuddy/mem-demo
#              http://proxy.example.com:8080/codebuddy/default
#      - API Key:  the user_key obtained in step 1 (sk-mem-* format)
#      - Model:    a model name supported by the upstream
#   3. The client sends its first message -> proxy intercepts -> verifyUserKey -> listTeams -> listAgents
#      -> listTasks -> interactive form to pick team/agent/task -> register session -> automatically inject, every turn,
#      L2(agent) + L3(team) memory into the system prompt -> forward to the upstream LLM.
#
# Multi-user isolation is built in: listTeams(userId) returns only the teams the user belongs to, and listAgents
# filters again by user; different session_ids have independent session state machines.
#
# To skip the form for integration testing: enable debugForceIdentity / debugForceUserId below (local/E2E only).
# When disabled, the full form interaction is used by default, which is the standard production path for multi-user scenarios.

# ── Logging ─────────────────────────────────────────────────────────────────────
log:
  file: logs               # Log directory; usage JSONL + proxy.log structured logs are generated per date
                           #   Leave empty "" to skip file output (console only)
  verbose: false           # true = additionally print debug info to stderr
  level: info              # info | debug -- debug additionally prints routing/analysis details
  backend: console         # noop | console -- structured logs go to stderr (console) or are disabled (noop)
  rotate:
    maxSizeBytes: 104857600  # Max bytes per proxy.log file; rotates once exceeded (default 100MB)
    backupLimit: 10          # Max number of rotated backups to keep


# ── Redis (legacy backend for the injection / Skill layers) ────────────────────────────────────────
# Injection / Skill layer data (inj:*, sk:*, skill:vpin:*) goes to Redis by default (legacy behavior).
# Once storage.enabled=true below is set, this data goes to ProxyStorage
# (COS/SQLite/FS/Memory) instead. See the storage: section.
redis:
  enabled: true            # Whether to enable Redis; whether injection/Skill data uses Redis is decided by storage.enabled.
  # url: "redis://:password@host:port/db"   # Full Redis URL; when set, overrides host/port/password/db below
  host: "127.0.0.1"        # Redis host
  port: 6379               # Redis port
  password: ""             # Redis password
  db: 0                    # Redis database number
  ttlSeconds: 1800         # Injection and Skill cache TTL (seconds), default 1800 (30 minutes)
  # injectionTtlSeconds: 3600  # Injection-layer hook cache TTL (seconds); defaults to reusing ttlSeconds
  # turnSeqTtlDays: 30       # TTL (days) of the session turn sequence counter, default 30. Must be much longer than
  #                          # ttlSeconds: session state expiring only loses cache, whereas the sequence expiring makes the same
  #                          # session restart counting from 1, colliding with that session's earlier usage rows.
  # CostGuard session state (cg:sess:* / arch: / judge-*) also uses this Redis.
  # Must be enabled for multi-instance deployments, otherwise task archive / judge latch cannot be shared across processes.


# ── Cost Guard (optional private routing extension; passes through transparently when the submodule is not initialized) ────────
# The host only parses enabled / markerOptIn / agentProfile / anthropicUpstream.
# The remaining fields are put into options as-is and handed to @context-proxy/cost-guard.
#
# Options used by the current extension (behavior when omitted):
#   taskArchiveEnabled  omitted = true. Adds one synchronous gate LLM call per new user turn.
#   judge.enabled       omitted = false. Once enabled, baseUrl must be set; the host makes the HTTP calls.
#   compress* / gate*   when omitted, fall back to the analyze model.
#   requestPrepare      CCR compression facade, independent of the routing switch.
costGuard:
  enabled: false
  markerOptIn: false       # true = only /{agent}/{spaceId}/cost-guard/... goes through routing
  agentProfile: auto
  # anthropicUpstream:
  #   url: "https://anthropic-upstream.example.com"
  # analyzeModel: "deepseek-v4-flash"
  # analyzeUrl: "https://analyzer.example.com/v1/chat/completions"
  # analyzeApiKey: ""
  # analyzeProtocol: openai
  # analyzeTimeout: 30000
  # cheapModel: "deepseek-v4-pro"
  # cheapUrl: ""
  # cheapApiKey: ""
  # cheapProtocol: openai
  # toolLoopDegradeStrategy: none
  # agents:                  # Override the cheap config by the first URL segment, agentName
  #   claude-code:
  #     cheapModel: "claude-haiku"
  #     cheapUrl: "https://cheap.example.com"
  # taskArchiveEnabled: true
  # compressModel: "deepseek-v4-flash"  # selector + merge; when omitted, falls back to analyze*
  # compressUrl: "https://analyzer.example.com/v1/chat/completions"
  # compressApiKey: ""
  # compressProtocol: openai
  # compressTimeout: 30000
  # gateModel: "deepseek-v4-flash"      # Synchronous critical path; when omitted, falls back to compress*
  # gateUrl: "https://analyzer.example.com/v1/chat/completions"
  # gateTimeout: 8000
  # judge:
  #   enabled: false
  #   baseUrl: "http://judge.example.com"
  #   userTurnTimeoutMs: 25000
  #   agentTurnTimeoutMs: 10000
  #   everyNToolTurns: 5
  #   latchTtlSeconds: 0
  #   latchMaxTurns: 0
  # controlPlane:            # Enabled when this block is present; omit the whole block to disable
  #   port: 18097
  # requestPrepare:
  #   enabled: false
  #   # CFQ (context_focus_question) subsystem. All fields are optional; omit the whole block to use the built-in defaults.
  #   cfq:
  #     enabled: true
  #     # Whether to inject a context_focus_question field into tool schemas so the main model fills it in itself (T1).
  #     # With false and analyzeModelFallback.enabled true below, it enters "pure fallback mode":
  #     # the main model has no idea CFQ exists, and the analysis model infers everything on the response side.
  #     injectSchema: true
  #     # Empty array = whitelist disabled; all tools outside the built-in blacklist are injected.
  #     # The built-in blacklist only recognizes Claude Code's PascalCase names (Edit/Write/...);
  #     # snake_case tools of other clients must be listed in schemaBlacklist yourself.
  #     schemaWhitelist: []
  #     schemaBlacklist: ["edit_file", "write_file", "create_file",
  #                       "str_replace_editor", "apply_diff", "replace_in_file"]
  #     enforceRequired: true
  #     maxLength: 200
  #     # When the main model forgets to fill in CFQ, a cheap model generates it on the response side and writes it into the same cache,
  #     # so the next turn's backfill hits as usual. Enabled by default; only an explicit enabled: false turns it off.
  #     #
  #     # When model / url / apiKey are omitted or empty, they fall back to the top-level costGuard analyzeModel /
  #     # analyzeUrl / analyzeApiKey. If any of the three is still missing after filling, the fallback is disabled as a whole; after startup,
  #     # grep cfq.analyze_fallback.misconfigured to confirm. A non-empty value written here is used as-is.
  #     #
  #     # Other fields use the code defaults when omitted: batchSize 8, timeoutMs 30000,
  #     # maxOutputTokens 128000、awaitPendingMs 8000、circuitBreaker 300/50/1800。
  #     analyzeModelFallback:
  #       enabled: true
  #       batchSize: 8
  #       # model / url / apiKey may be omitted; defaults to the analyze* above
  #       timeoutMs: 30000
  #       # Upper bound (ms) on waiting for an in-flight fallback when the request side finds a backfill gap.
  #       #
  #       # This window is the fallback's only chance: if it finishes in time it is compressed this turn; on timeout a no_cfq cache entry is written
  #       # and no further backfill happens. This is for byte stability -- letting a timed-out entry be compressed on the next turn would turn
  #       # the same tool_result from raw to compressed, invalidating the whole prefix after the flip point in the upstream
  #       # prompt cache.
  #       #
  #       # Basis for 8000: measured over 77 fallbacks, median 6.6s, 82% finish within 8.5s; the wait is counted from the
  #       # arrival of the next turn's request (the fallback has already run about 0.5s). The cost is that turns with a gap block for
  #       # about 6.5 seconds on average; tune it to your analysis model's actual speed.
  #       #
  #       # Upper bound is constrained by PENDING_TTL_S (30s) in pending.ts. 0 = do not wait; the fallback degrades to
  #       # helping subsequent turns only, and the current turn is always no_cfq.
  #       awaitPendingMs: 8000
  #       # Fallback circuit breaker -- a cost gate isolated per spaceId, with counts shared across nodes via Redis.
  #       #
  #       # If a space exceeds threshold fallbacks within windowSeconds, no fallback is done for the next
  #       # breakSeconds, and those tool_results are treated as no_cfq.
  #       # No in-flight marker is set during the breaker period, so the request side does not wait awaitPendingMs either.
  #       #
  #       # Omit the whole block to use the defaults (300 / 50 / 1800); to turn it off you must explicitly set enabled: false.
  #       # Tune the threshold to your own traffic: 50 per 5-minute window, then rest 30 minutes after tripping.
  #       # The breaker is meant to stop runaway amplification, not to set a quota for normal usage.
  #       circuitBreaker:
  #         enabled: true
  #         windowSeconds: 300
  #         threshold: 50
  #         breakSeconds: 1800


# ── Memory instance x actual model Input TPM / QPM rate limiting ──────────────────────────────
# Applies to all main-model calls whose URL carries a spaceId.
# Multiple pods count atomically via the shared Redis above. When Redis is unavailable it fails open and logs a warning.
# Instance/model overrides are managed via /v3/admin/rate-limits and take effect on the very next request after changes.
rateLimit:
  tpm: 1000000             # Actual Input Tokens / last 60 seconds
  qpm: 100                 # Requests initiated / last 60 seconds; uses the same dimension as TPM


# ── Storage (unified storage abstraction for the injection + Skill layers, replacing Redis for inj:*/sk:*/vpin:*) ─
# See docs/design/2026-07-09-redis-to-cos-migration-plan.md
#
# [Master switch] storage.enabled=false (default) -> fully uses the original Redis path; migration code is not loaded,
#           behavior is **exactly the same** as before this migration.
# [Switch semantics] storage.enabled=true -> ProxyStorage replaces the inj:*/sk:*/vpin:*
#           Redis repos.
#
# [Production recommendations]
#   - Single instance, local/internal: backend=sqlite (default; uses ~/.tdai-memory-proxy/proxy.db)
#   - Production multi-instance:       backend=cos (shared across nodes + cheap object storage)
#   - Offline/private deployment:      backend=fs
#   - Fallback / testing:              backend=memory
#
# [Degradation chain] cos -> sqlite -> fs -> memory; if any backend fails init it degrades automatically,
#          and /health exposes storage.effective (anchor for production monitoring alerts)
#
# [Rollback] At any stage, set enabled=false to return to the Redis path without a restart.
#
# ═══════════════════════════════════════════════════════════════════════════
# Field cheat sheet ([req] = required / [opt] = optional with default / [dead] = not read under the current backend; removing it has no effect)
#
#   ┌─────────────────────────────┬────────┬───────────────────────────────────┐
#   │ Field                       │ cos    │ sqlite / fs / memory              │
#   ├─────────────────────────────┼────────┼───────────────────────────────────┤
#   │ enabled                     │ [req]  │ [req]                             │
#   │ backend                     │ [req]  │ [req]                             │
#   │ ttlDays                     │ [dead]*│ sqlite=[opt, default 7] fs/memory=[dead] │
#   │ cos.rootPrefix              │ [dead]**│ [dead]                           │
#   │ cos.endpointDomain          │ [opt]  │ [dead]                            │
#   │ cos.shark.baseUrl           │ [req]  │ [dead]                            │
#   │ cos.shark.*  (others)       │ [opt]  │ [dead]                            │
#   │ sqlite.dbPath               │ [dead] │ sqlite=[opt, default empty] others=[dead] │
#   │ fs.fsRoot                   │ [dead] │ fs=[req] others=[dead]            │
#   └─────────────────────────────┴────────┴───────────────────────────────────┘
#
#   * cos bucket expiry relies on the COS lifecycle rule; ttlDays is ignored
#   ** shark hardcodes "proxy_cache" on its side; any value on the proxy side has no effect
# ═══════════════════════════════════════════════════════════════════════════
storage:
  # [req] Master switch: false = fully use the legacy Redis path (default)
  enabled: false

  # [req] Preferred backend: cos | sqlite | fs | memory
  #   - cos:    production multi-instance deployments (shared across nodes)
  #   - sqlite: single-instance local development / CI; has a sweeper that cleans the ttl bucket automatically
  #   - fs:     offline / docker fallback; no sweeper
  #   - memory: fallback / testing; cleared on process restart
  # Production multi-node must use cos; sqlite/fs/memory are all process-local, so cross-node reads always miss.
  backend: sqlite


  # ── TTL / NoTTL prefix tiers (business code places keys into buckets by key prefix; see the 2026-07-10 plan) ─────
  # `ttl/`   -- hot cache: inj-sess (session init state) / inj-hook (pre-warmed injection).
  #             Can be rebuilt if lost (binding fallback / rerun hook), with no business impact.
  # `nottl/` -- business state: binding / sk-extract / skill-vpin. **Kept permanently**;
  #             do not configure any lifecycle rule; losing it forces users to redo the session_init form.
  #
  # Only the `ttl/` prefix is cleaned (each backend implements this differently):
  #   - CosStorage:    ⚠️ ttlDays is **not read**! Configure a lifecycle rule in the COS console:
  #                    delete `proxy_cache/ttl/` prefix objects unmodified for N days. **Do not configure nottl/**.
  #   - SqliteStorage: built-in sweeper runs every 5 minutes and cleans the ttl bucket of the proxy_kv table by ttlDays
  #   - FsStorage:     no sweeper (container FS mtime is unreliable); leave it to an external tmpwatch
  #   - MemoryStorage: cleared on process restart; this TTL has no effect
  #
  # [cos=dead / sqlite=optional, default 7 / fs+memory=dead] Cleanup window (days) for the `ttl/` prefix.
  ttlDays: 7

  # ── COS backend (preferred for production multi-instance) ─────────────────────────────────────────────
  # Before going live you must configure a lifecycle rule in the COS console:
  #   `proxy_cache/ttl/`   prefix unmodified for N days -> delete
  #   `proxy_cache/nottl/` prefix -> no rule configured -> kept permanently
  #
  # Only kernel-sts mode is supported (static AK/SK is forbidden in production):
  # - Each spaceId pulls its own STS from Shark, with permissions strictly bound to
  #   the two prefixes `proxy_cache/ttl/{spaceId}/*` + `proxy_cache/nottl/{spaceId}/*`
  # - bucket / region are parsed from the CosUrl returned by Shark; no configuration needed
  # - When endpointDomain is unset it is decided automatically by a 4-level priority (see the field comment); leaving it empty works fine
  # - When Shark is unavailable the COS backend fails to assemble, and the process does not start in degraded mode
  # See docs/design/2026-07-12-cos-shark-sts-credential-plan.md
  #
  # Key layout：
  #   proxy_cache/{ttl|nottl}/{spaceId}/{userId}/{agentSource}/{sessionId}/...
  # ttl/nottl must come before spaceId -- lifecycle rules do not support wildcards in the middle of a path.
  #
  # The whole block can be removed when backend != cos.
  cos:
    # [dead] shark hardcodes "proxy_cache" on its side; the proxy layer never reads this field.
    # Kept only for backward compatibility of the yaml structure and will be removed in the future. Removing it has no effect.
    rootPrefix: "proxy_cache/"

    # [opt] Overrides the endpoint domain of the COS SDK. **Highest priority**.
    # When unset (empty / undefined), it is decided automatically by a 4-level priority, aligned with core
    # `tdai-memory-openclaw-plugin/src/gateway/server.ts::initSharedCosClient`：
    #   1. This field is non-empty                                  -> use it
    #   2. Shark CosUrl is already a VPC internal address (cloud vendor intranet domain) -> use it
    #   3. Shark CosUrl is public -> automatically rewritten to the VPC intranet domain (built from cred.region)
    #   4. None of the first three apply (cred has no region)       -> SDK default public endpoint
    # Production kernel-sts deployments (inside the cloud vendor's VPC) can usually leave it empty -- the intranet is used automatically, saving cost and more stable.
    # Deployments outside the cloud vendor's VPC must explicitly configure a public / custom domain, and make sure the bucket allows the corresponding network.
    # Supports the `{Bucket}` placeholder (custom CDN scenario).
    endpointDomain: ""   # e.g. `cos.example.com` (custom CDN or public mapping)

    # ── Fetching temporary credentials from Shark ──
    # Requires the Shark-side endpoint `POST /meta/GetProxyCacheCosConfig` (see plan doc §3.1).
    shark:
      # [req] Shark admin plane base URL. This is the test environment address; for production the deployer overrides it in config.yaml.
      baseUrl: "http://gateway.example.com:8000"

      # [opt] Timeout (ms) for shark HTTP requests. Default 10000.
      timeoutMs: 10000

      # [opt] Retry count on 5xx / 429 / network error / timeout. Default 2.
      retryCount: 2

      # [opt] How many ms before STS expiry to refresh. Default 120000 (2 min).
      # The value affects availability: too short -> shark jitter leads to expired credentials being used; too long -> needlessly frequent refreshes.
      refreshBufferMs: 120000

      # [opt] Upper bound of the per-spaceId backend pool (LRU). Default 100.
      # The value affects capacity: once the number of multi-tenant spaces exceeds it, LRU eviction occurs (old backends are closed with a delay).
      maxSpaces: 100

      # [opt] Delay in ms before closing an old backend on LRU eviction (protects in-flight requests). Default 30000.
      graceCloseDelayMs: 30000

  # ── SQLite backend (single-instance local development / CI) ─────────────────────────────────────
  # The only backend where "changing yaml ttlDays takes effect immediately" -- the sweeper runs every 5 minutes and cleans the ttl bucket of the proxy_kv table by the top-level
  # ttlDays (the nottl bucket is kept permanently).
  # The whole block can be removed when backend != sqlite.
  sqlite:
    # [sqlite=optional, default empty / others=dead] Empty = PROXY_DB_PATH env or ~/.tdai-memory-proxy/proxy.db
    dbPath: ""

  # ── Local filesystem (offline / docker read-only fallback) ──────────────────────────────────
  # No sweeper (fs.stat().mtime is unreliable on container FS); leave it to an external tmpwatch.
  # The whole block can be removed when backend != fs.
  fs:
    # [fs=required / others=dead] Root directory (must be writable)
    fsRoot: "/var/lib/context-proxy/storage"


# ── Opik LLM observability (Comet ML Opik) ─────────────────────────────────────────
# Request/response traces and spans are reported to Opik automatically.
opik:
  enabled: false           # Whether to enable Opik reporting
  url: "http://127.0.0.1:5173"   # Opik service address
  apiKey: ""               # Opik API Key (if the Opik instance requires authentication)
  # stripRequestLogContent: false  # true = the forked request_log trace does not record message content (saves storage)


# ── Langfuse LLM observability (reported via the official SDK) ──────────────────────────────────────
# One trace = one turn (one user input); tool-loop requests within the same turn are grouped as multiple generations under the same
# trace. Reported content includes: model/latency/token usage/cache hits/cost.
langfuse:
  enabled: false           # Whether to enable Langfuse reporting
  host: ""                 # Langfuse instance base URL, e.g. http://localhost:3000
                                                    #   OTLP mode: fill in the OTLP endpoint
  publicKey: ""            # Langfuse public key (pk-lf-...); OTLP mode: fill in the token
  secretKey: ""            # Langfuse secret key (sk-lf-...); OTLP mode: leave empty


# ── ClickHouse usage reporting ──────────────────────────────────────────────────────
# Records each user's token consumption per turn, supporting queries by model / user / session.
# 表结构含：timestamp / model_id / key_id(用户) / session_key + turn_seq(turn) /
#           user_input / prompt_tokens / completion_tokens / total_tokens /
#           cache_hit_tokens / cache_write_tokens。
# 4xx/5xx 失败请求不写入。
clickhouse:
  enabled: false           # Whether to enable ClickHouse usage reporting
  url: "http://clickhouse.example.com:8123"   # ClickHouse HTTP endpoint
  database: context_proxy            # Database name
  table: usage_logs                  # Usage table name (known formats such as TokenHub)
  rawTable: usage_raw                # Raw usage trace table (non-TokenHub / unknown formats fall back here)
  user: default                      # ClickHouse username
  password: ""                       # ClickHouse password
  flushIntervalMs: 5000              # Periodic flush interval (ms), default 5 seconds
  flushThreshold: 50                 # Flush immediately once the buffer accumulates N rows (0 = disable batch flush)
  ttlDays: 30                        # Data retention in days (0 = never expire; takes effect at startup via CREATE TABLE TTL)


# ── Auth (user_key verification -> user_id resolution) ─────────────────────────────────
# When enabled, the proxy calls the kernel's POST /v3/meta/auth/verify to verify the client API Key.
# Any result other than valid=true returns 401 and rejects the request (including timeouts/network errors).
# x-tdai-service-id is extracted automatically from the request path /proxy/<spaceId>/...
# After verification passes, user_id is written to the ClickHouse key_id column and used as the user identifier across the whole chain.
auth:
  enabled: true            # Whether to enable authentication
  url: "http://kernel.example.com:8420"   # Kernel auth service base URL (/v3/meta/auth/verify is appended automatically)
  timeoutMs: 5000          # Auth request timeout (ms)


# ── Admin / Ops endpoint authentication (service-level shared secret) ─────────────────────────────
# Scope: only ops endpoints such as `/v3/instance/proxy-destroy` (shark cleans the proxy-side
# COS cache when destroying an instance). Fully independent of the tenant verifyUserKey in auth.* above -- that one is the tenant-level
# x-tdai-user-key check; this is a shared secret for ops/system services.
#
# Behavior (semantics aligned with core gateway's server.apiKey, see openclaw-plugin
# gateway/server.ts:1076-1089）：
#   - apiKey empty (default)     = auth disabled, ops endpoints publicly accessible; no warning at startup
#                                 (production relies on network isolation + apigw as a safety net, same as core's current
#                                 production, where `TDAI_GATEWAY_API_KEY` is also not enabled)
#   - apiKey non-empty           = requests must carry `Authorization: Bearer <apiKey>`
#                                 with constant-time comparison (crypto.timingSafeEqual)
#
# How to choose the value:
#   - A fixed string agreed on by both sides (proxy side + shark side), unrelated to any specific instance
#   - Usually generated by ops with `openssl rand -hex 32` and distributed to both the proxy's
#     `TDAI_PROXY_ADMIN_API_KEY` env and shark's client config
#   - It is not the admin user_key of any memory instance (that is an in-instance user concept going through `x-tdai-user-key`;
#     the two are completely unrelated)
#
# Priority: env TDAI_PROXY_ADMIN_API_KEY > yaml admin.apiKey > default ""
admin:
  apiKey: ""               # Empty = ops endpoints public (equivalent to not configuring). In production, inject it via
                                                    # env TDAI_PROXY_ADMIN_API_KEY to avoid committing it to git


# ── System users (internal service accounts: a hit passes through the whole chain) ─────────────────────────────
# Match flow: first verify the apiKey via auth/verify to get user_id -> if user_id is in the systemUsers
# list below -> hit, short-circuit passthrough. After a hit the proxy forwards the request as-is to
# config.upstream.url, skipping session initialization and context injection.
# usage/credit is still recorded (keyId = userId, spaceId = the memory instance id in the path).
# Depends on auth.enabled=true -- with auth off, verify returns an empty user_id and the short-circuit never triggers.
# The userKey field is kept only for ops reference (it used to be the match key; now it only appears in logs/comments),
# and may be omitted; userId is required. The array supports multiple entries; an empty array disables this feature.
systemUsers:
  - name: memory                              # Logical name, used only in logs
    userId: "${TDAI_MEMORY_SYSTEM_USER_ID}"   # Match key & billing-owner user_id (required)
    displayName: "${TDAI_MEMORY_SYSTEM_USER_NAME}"
    userKey: "${TDAI_MEMORY_SYSTEM_USER_KEY}" # Historical sk-mem-xxx, for ops viewing only (optional)
  # - name: wiki
  #   userId: "${TDAI_WIKI_SYSTEM_USER_ID}"
  #   displayName: "${TDAI_WIKI_SYSTEM_USER_NAME}"
  #   userKey: "${TDAI_WIKI_SYSTEM_USER_KEY}"


# ── Credit reporting (TDAI MemoryPlus billing) ──────────────────────────────────────
# After each LLM response completes, the CreditDelta for this turn is computed from the creditPricing price table and
# POSTed to the external billing service. Pricing is applied only for TokenHub upstreams; for non-TokenHub upstreams CreditDelta=0.
# Only requests carrying the /proxy/<spaceId>/ prefix trigger reporting; SpaceId is extracted from the path automatically.
# Streaming requests are best-effort: a failed report is only logged and does not interrupt the stream.
# When a non-streaming request fails, the reason is recorded in the `x-credit-report-error` response header.
creditReport:
  url: "http://gateway.example.com:8000/UpdateMemoryPlusUsage"
  timeoutMs: 5000          # Report timeout (ms), 0 = no timeout


# ── Credit price table ────────────────────────────────────────────────────────
# Unit: Credit / 1K Tokens.
# The legacy format (model top-level input/output/... and tiers) remains valid. If rules are configured,
# the first matching time-window rule is chosen in descending priority; if none matches, falls back to the model's top-level prices.
# Time rules are evaluated by default in the TokenHub timezone Asia/Shanghai, with time range [start, end).
# Model matching rule: usage.model -> case-insensitive whole-word match -> if unmatched, credit=0
#   (falls back to the usage_raw table and is marked reason='unknown_model').
# Field descriptions:
#   name          -- model ID (used to match usage.model; case-insensitive whole-word match)
#   modelName     -- display name (optional, for UI/reports; falls back to name when unset)
#   input         -- standard input tokens (non-cached portion)
#   output        -- output tokens
#   cacheRead     -- cache-hit read tokens (prompt_cache_hit_tokens / cache_read_input_tokens)
#   cacheWrite5m  -- cache write with 5-minute TTL (cache_creation.ephemeral_5m_input_tokens)
#   cacheWrite1h  -- cache write with 1-hour TTL (the non-ephemeral part of cache_creation_input_tokens)
# The timezone of peak/off-peak rules is fixed to Beijing time (Asia/Shanghai) and cannot be changed via configuration.
creditPricing:
  models:
    - name: "your-endpoint-id"         # Endpoint id / model alias issued by the upstream, e.g. Claude Sonnet
      modelName: "Claude Sonnet"
      input: 5.4935
      output: 27.4673
      cacheRead: 0.5493
      cacheWrite5m: 6.8668
      cacheWrite1h: 10.9869

    - name: "deepseek-v4-pro"          # DeepSeek V4 Pro
      modelName: "DeepSeek V4 Pro"
      input: 0.4500
      output: 0.9000
      cacheRead: 0.0038
      cacheWrite5m: 0.4500
      cacheWrite1h: 0.4500

    - name: "deepseek-v4-flash"        # DeepSeek V4 Flash
      modelName: "DeepSeek V4 Flash"
      input: 0.1500
      output: 0.3000
      cacheRead: 0.0030
      cacheWrite5m: 0.1500
      cacheWrite1h: 0.1500

    # Example: weekday peak/off-peak pricing. Each request matches only one rule; only after a match is the length tier selected via tiers (if any).
    - name: "deepseek-v4-pro-0813"
      modelName: "DeepSeek V4 Pro 0813"
      # Top-level prices are the compatibility fallback when no rule matches (here, the idle price).
      input: 0.4500
      output: 1.3500
      cacheRead: 0.0150
      cacheWrite5m: 0
      cacheWrite1h: 0
      rules:
        - id: "weekday-peak"
          priority: 100
          when:
            weekdays: [mon, tue, wed, thu, fri]
            timeRanges:
              - { start: "09:00", end: "12:00" }
              - { start: "14:00", end: "18:00" }
          pricing:
            input: 0.9000
            output: 2.7000
            cacheRead: 0.0300
            cacheWrite5m: 0
            cacheWrite1h: 0


# ── Context injection (injection pipeline) ─────────────────────────────────────────
# Injects relevant knowledge/memory/skills into the system prompt of every LLM request.
# The injection pipeline runs after session init completes.
# Each injector is an independent Hook, executed in registration order.
#
# Available injectors:
#   skill       -- <cloud_skills> block: retrieves relevant skills from the kernel RAG and injects them into the system prompt;
#                 also injects a <skill_tools> block telling the LLM how to call skills via curl.
#                 Data source = the endpoint of the skill section (kernel gateway).
#   knowledge   -- <knowledge_tools> block: pulls the team's knowledge resource list from the kernel and
#                 injects a two-step self-discovery flow tool (depends on skill.serviceToken).
#   tdai-memory -- TDAI L2/L3 memory injection (controlled by tdai.memory.*; see the tdai section).
injection:
  enabled: true             # Whether to enable context injection (when off, the injectors list below is entirely ignored)
  injectors: ["skill", "knowledge", "tdai-memory"]   # List of injectors to enable
  # Unified external gateway address -- the curl URLs embedded in the <skill_tools> / <tdai_memory_tools>
  # sections generated for the LLM all use this as base. Fill in only the gateway domain, **without a port**
  # (the port the gateway routes to proxy pods is configured by ops on the gateway side and is unrelated to this).
  #
  # ⚠️ Required for multi-node deployments. When unset, each pod falls back to its own host:port -> the same
  # hook cache in COS gets overwritten by pods against each other -> the upstream Anthropic KV cache misses every time (costly + slow).
  #
  # The gateway side must pass the following two prefixes through to the proxy pod as-is:
  #   /skill-bridge/**   → proxy /skill-bridge/**
  #   /memory-bridge/**  → proxy /memory-bridge/**
  externalGatewayUrl: "https://gateway.example.com"

  # ── Asset reflection mode (for internal effect evaluation; enabled by default) ─────────────────────────────
  # Structure aligned with costGuard.markerOptIn, but with the opposite default:
  #   markerOptIn=true (default): AssetReflectionInjector is registered. The marker is still
  #                             opt-in -- only when the request URL carries an `/analyse` segment (structured like
  #                             `/cost-guard`: placed after `/{agent}/{spaceId}`, e.g.
  #                             `/codebuddy/default/analyse/v1/messages`) is the
  #                             `<asset_reflection>` block emitted at the end of the system prompt, instructing the
  #                             agent to review "which cloud asset tools were called this turn and whether each
  #                             was useful". Normal requests without the marker are completely unaffected.
  #   markerOptIn=false: AssetReflectionInjector is not registered, and the top-level gate any
  #                       带 `/analyse/` 段的请求直接 404,零性能开销。适合确认
  #                       不需要资产反思能力的部署显式关掉。
  # tag 列表由本节点上实际 register 的资产 injector 决定（skill / tdai-memory /
  # knowledge）,一个都没启用时 injector 恒不 emit。
  assetReflection:
    markerOptIn: true


# ── 提取（写侧：把每轮对话/工具调用回流到内核） ─────────────────────────────
# 与 injection 对偶：injection 决定"往 prompt 塞什么"，extraction 决定"往内核回写什么"。
#
# extractors 白名单说明（不在列表里 = 不写回）：
#   skill        — 每轮真人对话结束时调 /v3/skill/conversation/add, core 侧按阈值归档
#                   （依赖 skill.endpoint + skill.serviceToken）
#   tdai-memory  — 每轮把 user_query + assistant reply 写入 L0 短期记忆
#                   （依赖 tdai.enabled + tdai.memory.writeL0）
#
# 缺省行为（不写这段）：enabled=true, extractors=["skill","tdai-memory"] — 与历史等价。
# 想"只注入不提取"：extraction.enabled: false 即可，一刀切。
extraction:
  enabled: true
  extractors: ["skill", "tdai-memory"]


# ── 会话初始化（session init） ──────────────────────────────────────────────
# 用户首次对话时拦截请求，弹出交互式表单引导选择 team → agent → task，
# 选择完成后从内核拉取 agent/task 详情并注入到 system prompt。
#
# 流程：
#   1. 弹 asset_confirm 对话框：询问用户是否要关联团队资产
#   2. 选择 team（仅多 team 时弹出）
#   3. 选择 agent（支持分页）
#   4. 选择 task（可选，支持分页/跳过）
#   5. 注册会话 → 注入 agent/task 上下文到 system prompt
#
# 状态存储：默认 Redis（redis.enabled=true）；启用 storage.enabled=true 后走
# ProxyStorage（COS/SQLite/FS）。都不启用则回落 SQLite 单实例本地存储。
# team/agent/task 列表来自内核 MetadataClient（复用 skill 段配置）。
# 用户身份由 auth/verify 一跳确定；未通过鉴权/无法识别用户 → 直接 bypass session init。
sessionInit:
  enabled: true             # 是否启用会话初始化
  maxRetries: 3             # 表单解析失败最大重试次数，超出后 bypass（跳过 session init）
  # skipAssetConfirm: true  # 跳过"是否关联团队资产"前置对话框，默认视为选"是"直接进入 team/agent/task 选择
  # 历史注释: 曾经有 keepInitArtifacts 开关用来在 session_init 完成后剥离
  # 假表单对话；已删除。现在**永远保留**用户的所有真实对话（含 session_init
  # form 交互），不做任何删除。
  # <session_context> 注入开关：session init 完成后，每一轮请求都会把 agent/task
  # 信息以 <session_context> 块追加到 system prompt。下面两个开关可分别静默。
  # 两个都关 = 完全不注入 <session_context>。默认都为 true，行为与历史一致。
  # 关闭时每个 session 只 warn 一次（避免长会话刷屏）。
  injectAgentContext: true  # false = 不注入 [Agent] 段（id/name/description/prompt）
  injectTaskContext: true   # false = 不注入 [Task] 段（id/name/description/goal）
  # header 自动预选：首轮请求头已带身份字段时，去列表里校验存在性，命中则跳过对应选择步骤。
  headerAutoSelect:
    enabled: true            # 是否启用 header 预选
    teamHeader: "x-team-id"  # 携带 team_id 的请求头名
    agentHeader: "x-agent-id" # 携带 agent_id 的请求头名
    taskHeader: "x-task-id"  # 携带 task_id 的请求头名（可选）
    onMismatch: "form"       # header 值查不到时：form=回退交互表单（默认）| bypass=跳过 session init

  # ── DEBUG：本地开发/e2e 短路 ────────────────────────────────────────────────
  # 打开 debugForceIdentity 后，agentSource=workbuddy 和 agentSource=codebuddy
  # 的会话会**直接**注册为固定三元组，绕过所有表单/header 匹配逻辑；
  # 生产环境务必保持注释状态。
  # debugForceIdentity:
  #   team_id: team-xxxxxxxxxx
  #   agent_id: agt-xxxxxxxxxx
  #   task_id: task-xxxxxxxxxx
  # WorkBuddy 客户端的 auth/verify 没有真人身份 → 用下面这条把 userId 硬绑定到
  # 一个真实的 kernel user_id（配合 upstream.agents.workbuddy.apiKey 中的
  # x-tdai-user-key 用同一个 user 名下的 key）。生产环境保持注释。
  # debugForceUserId: usr-xxxxxxxxxx
  # 调试模式下输出详细诊断日志（请求 tools schema、system prompt 摘要等）。
  # 仅本地/E2E 联调使用，生产环境务必保持 false 或不配置。默认关闭。
  # debugVerboseLogging: false


# ── TDAI Memory Gateway（core / openclaw-plugin） ────────────────────────────
# proxy 通过与同机部署的内核 gateway（监听 8420）交互实现记忆读写。
# 四级记忆：
#   L0 — 短期对话记忆（最近 N 轮对话自动写入）
#   L1 — 会话级关键信息提取（从对话中提取可复用的结构化记忆）
#   L2 — Agent Profile（agent 的长效人格/规则/知识）
#   L3 — Team/Global 记忆（跨 agent 共享的组织级知识）
#
# 注入行为：
#   inject=true 时，L2+L3 作为系统级上下文注入 system prompt；
#   L0/L1 不直接注入 prompt（会破坏 KV cache），改为暴露只读工具供 LLM 主动查询。
tdai:
  enabled: true             # 是否启用 TDAI Memory
  endpoint: "http://127.0.0.1:8420"   # 内核 gateway 地址（通常与 skill.endpoint 相同）
  apiKey: "local"           # Authorization: Bearer 值（通常与 skill.serviceToken 相同）
  serviceId: "default"      # x-tdai-service-id header 值
  memory:
    enabled: true           # Memory 子模块总开关
    inject: true            # 上下文注入总开关（false = 所有 L0~L3 注入全关）
    writeL0: true           # 是否写入 L0（短期对话记忆）
    recallL1: true          # 是否启用 L1 召回（从对话中检索相关记忆）
    injectL2L3: true        # 是否注入 L2（Agent Profile）+ L3（Team/Global 记忆）到 system prompt
    l1Limit: 5              # L1 召回最大条数
    l2Limit: 3              # L2/L3 注入最大条数
    timeoutMs: 5000         # 单次内核调用超时（毫秒）


# ── Skill / 内核 gateway 数据面 ──────────────────────────────────────────────
# proxy 通过此配置与内核 gateway 通信，用于三项能力：
#   1. <cloud_skills> RAG 注入：GET /v3/skill/search 检索相关 skill
#   2. Skill 归档触发：每轮真人对话结束调 /v3/skill/conversation/add,
#      core 侧按 tool_call ≥ 10 或 bytes ≥ 40KB 阈值归档并异步抽取。
#   3. knowledge injector 拉取 team 知识资源列表
# 同一个 serviceToken 也会被 /skill-bridge 反代在转发 LLM curl 时注入，
# 避免 token 出现在 LLM 可见的 prompt 中。
# sessionInit 的 team/agent/task 列表也通过此内核获取（MetadataClient）。
#
# 段名兼容：也可写作 `coreSkill:`（旧名，仍被读取）；两者同时存在时 `skill:` 优先。
skill:
  endpoint: "http://127.0.0.1:8420"   # 内核 gateway 地址（通常与 tdai.endpoint 相同）
  serviceToken: "local"               # 鉴权凭据 → Authorization: Bearer <serviceToken>
                                       #   与内核约定的服务白名单一致；本地开发用 "local"
  serviceId: "context-proxy"          # 租户/服务标识 → x-tdai-service-id
                                       #   请求路径带 /proxy/<spaceId>/ 时会被 spaceId 覆盖
  timeoutMs: 1500                     # 单次调用超时（毫秒）。RAG 在 session_init 热路径上，不宜太大


# ── Instance-upstream 配置缓存（自定义模型分流的每实例配置） ─────────────────
# proxy 每次 handler 会走 skill.endpoint + /v3/internal/meta/instance-upstream/list
# 拉本 spaceId 的模型分组配置（default / custom / extraction 三类行），
# 结果按 spaceId 缓存在进程内。数据接口复用 skill: 段的 endpoint / serviceToken /
# timeoutMs，但语义与 skill 无关，独立成段以便未来扩展别的旋钮。
#
# 缓存内部固定语义（写死不走 yaml）：
#   - hard expiry（不 refresh-on-access）+ stale-if-error 兜底
#   - 最多 256 个实例，LRU 按写入顺序淘汰
#   - 首次拿不到 → 返空 → 走"零行 fallback = official"，业务侧行为 = v1
instanceUpstream:
  # 缓存 TTL（秒）。默认 30。决定"Panel 改完自定义模型 → proxy 生效"的最长延迟。
  #   非法值（0 / 负数 / NaN / 小数）一律回退默认 30s + warn 一行。
  #   调优参考：
  #     - 用户改完要 ≤1min 生效 → 保默认 30s
  #     - core QPS 压力大、接受 N 秒生效 → 60~300 合理
  #     - 别 <5s：会把 core /v3/internal/meta/instance-upstream/list 打热点
  cacheTtlSec: 30


# ── Knowledge tools 注入（独立 gateway 配置） ───────────────────────────────
# proxy 通过此配置访问内核 gateway 拉取 team 知识资源（code-graph / wiki），
# 渲染 <knowledge_tools> 块注入 system prompt，LLM 据此调 KS 的 tools/list|call。
#
# 与 skill 段独立：endpoint 可以不同（例如 skill 走内核直连 IP，
# knowledge 走 API Gateway 域名）。
#
# 关闭方式：enabled=false（默认），injector 不注册，无注入。
knowledge:
  enabled: false                        # 默认关闭，跟 tdai.enabled 行为一致
  endpoint: "http://127.0.0.1:8420"     # 内核 gateway 地址
  serviceToken: "local"               # Authorization: Bearer
  serviceId: "context-proxy"          # x-tdai-service-id（被请求路径 spaceId 覆盖）
  timeoutMs: 1500                     # 单次调用超时（毫秒）


# ── Skill 运行时 ──────────────────────────────────────────────────────────
#
# skill 抽取链路: proxy 每轮真人对话结束 (agent 给出无 tool_use 的最终回复)
# 时, 同步调用 POST /v3/skill/conversation/add, 把本轮 conversation 切片
# 交给 core。core 自己维护 buffer, 累计到 tool_call ≥ 10 或 bytes ≥ 40KB
# 时归档并触发后台 Worker 抽取 skill。proxy 不需要额外配置。
#
# 历史配置项 (已删除): extractToolCallThreshold / maxBucketCount /
# conversationAddEnabled — 属于 proxy 侧老链路 SkillExtractTrigger, 已下线。
skillRuntime:
  allowLlmWrite: false           # 是否允许主模型创建/修改 skill（默认 false）
                                 #   false: <skill_tools> 只注入只读工具（search/list/view/files_read）
                                 #          /skill-bridge 拒绝写操作返回 403
                                 #   true:  <skill_tools> 注入全部工具（含写操作 create/update/delete 等）
                                 #          /skill-bridge 放行写操作


# ── mem: 特殊命令 ──────────────────────────────────────────────────────────
# 用户在对话框输入 mem:sync / mem:create-skill / mem:help 等命令时，
# Proxy 在 session init 之后拦截，执行对应操作并直接返回伪造 LLM 响应，
# 不注入系统提示词（不破坏 KV cache），不转发给上游模型（零 token 消耗）。
# L0 写入 / skill extract 等记录层照常执行，对话时间线不断层。
#
# 该拦截**默认恒定启用**（无 enabled 开关，无命令白名单），未知命令由内置
# KNOWN_COMMANDS 兜底返回提示。可选子字段 taskDraft 仅用于配置 mem:create-task /
# mem:update-task 使用的 LLM 草稿生成器（未配置时该两个命令返回 "未配置" 错误，
# 其它命令不受影响）。
# memCommand:
#   taskDraft:
#     enabled: true
#     model: "..."
#     url: "..."
#     apiKey: "..."   # 也可用 TDAI_TASK_DRAFT_API_KEY 环境变量覆盖
#     timeoutMs: 20000

# ── CC 请求分流 ────────────────────────────────────────────────────────────
# 识别 CC 客户端（Claude Code CLI）后台自发的辅助请求，走差异化处理路径：
#   - main (主对话/tool-loop):    走全套 (session-init + injection + L0 + skill + credit)
#   - fork (SUGGESTION/RECAP/…): 复用 MAIN cache — 跳过 session-init form / mem 拦截 /
#                                L0 / skill；injection 走 readOnly（不 self-heal cache）；credit 上报
#   - sidequery (TITLE/probe/…): 独立小请求 — 跳过 session-init / mem 拦截 / injection /
#                                L0 / skill；credit 上报
#
# 判定信号（源码硬约束 + 抓包实证）:
#   1) cache_control marker 在 messages[n-2] → fork
#   2) cache_control marker 在 messages[n-1] 或其它位置 → main
#   3) 无 marker + tools=[] + thinking.disabled → sidequery
#   4) 其它 → main（3P provider 关 caching 时的保底）
#
# 关闭时所有请求视为 main，走完全等价老链路。
# 详见 docs/design/2026-07-30-cc-request-routing-plan.md
ccRequestRouting:
  enabled: true                    # 默认开启。关闭时所有请求强制 main，title-gen 并发会撞 session-init state 导致 bypass。


# ── Per-Agent 上游路由 ─────────────────────────────────────────────────────
# 见文件顶部 `upstream.agents` 一段。


# ── 本地 JSONL Trace 归档 ─────────────────────────────────────────────────────
# 启用后，每个 trace + span 以 JSONL 行追加写入本地文件（按日期分文件），
# 文件名格式：<hostname>-<YYYY-MM-DD>.jsonl
# 可配合 crontab 脚本定时压缩上传到 COS/S3 归档存储。
#
# 此归档链路独立于 Opik / Langfuse 远程上报：即使远程上报关闭，本地归档仍可独立工作。
# 默认关闭，对性能无影响。
traceArchive:
  enabled: false                   # true = 启用本地 JSONL trace 归档；false = 关闭（默认）
  dir: "logs/traces"               # 归档目录（相对于项目根目录或绝对路径）


# ── Pipeline 重构灰度切换 (2026-09-28, addendum) ─────────────────────────────
# blueprint-review §2 采纳: 按 agent 粒度灰度, 每步只 flip 一个 key。
#
# 未定义 pipeline 字段 → 全部走老 handler.ts / anthropicHandler.ts /
# codexHandler.ts / workbuddyHandler.ts / directHandler.ts / auxiliaryHandler.ts,
# 与重构前 100% 等价 (向后兼容红线)。
#
# 迁移顺序 (v2 §4 Phase 4.1-4.5, 风险递增):
#   1. direct        Phase 4.1 - 最简单最低风险
#   2. utility       Phase 4.1 - 同批
#   3. codex         Phase 4.2 - codex/wb 起步 stageGates=minimal, 与老 handler 等价
#   4. workbuddy     Phase 4.3
#   5. codebuddy/dsh/opencode/pi  Phase 4.4 (handler.ts 承载, stageGates=full)
#   6. claude-code   Phase 4.5 - 最复杂的 anthropic 协议
#
# 回滚: 改回 false 或删除该行即可, 秒级生效。
#
# ⚠️ Phase 4.4/4.5 完全实现前, flip 到 true 时新 pipeline 会抛
# PipelineNotImplementedError, pick() 自动 fallback 到老 handler 并记一次 warn ——
# 生产不会挂线, 但 warn 一直响, 请勿提前 flip。
pipeline:
  migrated:
    # Phase 4 已完整完成 (2026-09-28): 全部 6 个老 handler (handler.ts /
    # anthropicHandler.ts / codexHandler.ts / workbuddyHandler.ts /
    # directHandler.ts / auxiliaryHandler.ts) 的完整实现都已迁移到
    # pipeline/runners/, 老 handler.ts 等文件已退化为 5-20 行 re-export shim。
    #
    # 因此: pipeline.migrated.<agent>=true 或 false 效果完全等价 (两个都会
    # 最终调到 pipeline/runners/ 里的完整实现) —— 只是多/少一层浅层 shim 转发。
    #
    # 保留本配置字段是为 Phase 6 清理路径:
    #   1. 清 server.ts pickHandler 层, 直接指向 entrypoints/*
    #   2. 删本 pipeline 段
    #   3. 删 6 个 shim 文件
    # 逐步来, 每步独立可回滚。
    #
    # 唯一副作用差异: 迁移过程中顺手修的 latent leak (addendum §2.4) —
    # direct/utility 的 SKIP_REQUEST_HEADERS 从 HOP_BY_HOP 版本升到
    # WITH_INTERNAL, 防 x-tdai-user-key 透传上游。
    # 默认 false, 走老 shim; 客户端确认无 x-tdai-user-key 依赖后可 flip。
    direct: false
    utility: false
    codex: false
    workbuddy: false
    codebuddy: false
    dsh: false
    opencode: false
    pi: false
    claude-code: false