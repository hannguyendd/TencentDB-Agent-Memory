# ============================================================
# TDAI Gateway -- local Mongo flavor config (used with docker-compose.local-mongo.yaml)
# ============================================================
# Use case: local containerized verification of the Mongo backend (atlas-local mongot + single gateway container)
# Storage selection: **determined by environment variables; this file contains no storage backend config** --
#   STORE_MODE=mongodb            data plane on Mongo (gateway flavor does not read memory.storeBackend)
#   MONGODB_ENDPOINT/DATABASE     Mongo connection info (inside compose points to the mongo-search service)
#   STATE_BACKEND=local           in-process state/pipeline (no Redis)
# Metadata: TDAI_METADATA_MONGO_URI not set -> automatically sqlite (lands in baseDir, converged only in Phase 4)
# ============================================================

deployMode: standalone
stateBackend: "local"

server:
  port: 8420
  host: "0.0.0.0"                      # must listen on all interfaces inside the container, otherwise port mapping has no effect
  apiKey: "${TDAI_GATEWAY_API_KEY}"    # empty locally = Layer1 auth off (same semantics as .env.knowledge-local)

data:
  baseDir: /data/tdai-memory

# -- LLM (required, injected via environment variables) --
llm:
  baseUrl: "${TDAI_LLM_BASE_URL}"
  apiKey: "${TDAI_LLM_API_KEY}"
  model: "${TDAI_LLM_MODEL}"
  maxTokens: 65536
  timeoutMs: 300000

# -- Memory engine config --
memory:
  capture:
    enabled: true
  extraction:
    enabled: true
    enableDedup: true
    maxMemoriesPerSession: 20
  persona:
    triggerEveryN: 50
    maxScenes: 15
  pipeline:
    everyNConversations: 5
    enableWarmup: true
    l1IdleTimeoutSeconds: 600
    l2DelayAfterL1Seconds: 90
    l2MinIntervalSeconds: 900
    l2MaxIntervalSeconds: 3600
  recall:
    enabled: true
    maxResults: 5
    scoreThreshold: 0.3
    strategy: "hybrid"
    timeoutMs: 5000
  embedding:
    provider: "none"                   # vectors off, native mongot BM25 only
  bm25:
    enabled: true
    language: "zh"

# -- Skill module --
skill:
  enabled: true
  routing:
    mode: "bm25"
    searchTopK: 20
  extraction:
    enabled: true
    maxIterations: 16
  resources:
    maxResourceSizeBytes: 5000000
    allowExecutable: false

# -- Metadata (meta_assets / ACL) --
metadata:
  maxUsersPerInstance: 500
  maxTeamsPerInstance: 100
  passwordPepper: "${TDAI_PASSWORD_PEPPER:-local-dev-pepper}"
