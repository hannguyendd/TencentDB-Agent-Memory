# ============================================================
# TDAI Gateway -- Standalone single-node config
# ============================================================
# Use case: local development / Hermes sidecar / single-Agent single-node deployment
# Features: zero external dependencies (no Redis/Shark needed), in-process state management
# ============================================================

deployMode: standalone
stateBackend: "local"

server:
  port: 8420
  host: "127.0.0.1"

data:
  baseDir: "~/.memory-tencentdb/memory-tdai"

# -- LLM (required) --
llm:
  baseUrl: "https://api.openai.com/v1"
  apiKey: "${TDAI_LLM_API_KEY}"    # injected via environment variable
  model: "gpt-4o"
  maxTokens: 4096
  timeoutMs: 120000

# ── v2 InstanceUpstream:supported-agents ──
# Source of truth is the Proxy `MemoryProxy/src/supported-agents.ts`; this is the Core-side copy,
# used for the §6.A supported-agents interface + the full agent set of the seed default group.
# See docs/design/2026-08-25-instance-upstream-config.md §6.A.
#
# Missing/empty array -> Core-side seed logic does not trigger -> Panel opens with an empty table -> Proxy takes the "zero-row fallback"
# (behavior equals v1, everything goes through the global upstream + alias), ensuring a missing config does not block business.
upstream:
  supportedAgents:
    - agent_source: claude-code
      protocol: anthropic
      display_name: Claude Code
    - agent_source: codebuddy
      protocol: openai-chat
      display_name: CodeBuddy
    - agent_source: codex
      protocol: openai-responses
      display_name: Codex
    - agent_source: workbuddy
      protocol: openai-responses
      display_name: WorkBuddy
    - agent_source: dsh
      protocol: openai-chat
      display_name: DeepSeek Harness
    - agent_source: opencode
      protocol: openai-chat
      display_name: OpenCode
    - agent_source: pi
      protocol: openai-chat
      display_name: Pi
    # -- header-only clients (hermes / openclaw): use anthropic /v1/messages,
    #    identity preselected via the x-team-id / x-agent-id / x-task-id request headers --
    - agent_source: hermes
      protocol: anthropic
      display_name: Hermes
    - agent_source: openclaw
      protocol: anthropic
      display_name: OpenClaw

# -- Memory engine config --
memory:

  capture:
    enabled: true

  extraction:
    enabled: true
    enableDedup: true
    maxMemoriesPerSession: 20

  persona:
    triggerEveryN: 50
    maxScenes: 15

  pipeline:
    everyNConversations: 5
    enableWarmup: true
    l1IdleTimeoutSeconds: 600
    l2DelayAfterL1Seconds: 90
    l2MinIntervalSeconds: 900
    l2MaxIntervalSeconds: 3600

  recall:
    enabled: true
    maxResults: 5
    scoreThreshold: 0.3
    strategy: "hybrid"
    timeoutMs: 5000

  # -- Storage backend --
  # sqlite: local SQLite (default, zero config)
  # tcvdb:  Tencent Cloud Vector Database (requires tcvdb config)
  storeBackend: "sqlite"

  # To use TCVDB, uncomment and fill in:
  # storeBackend: "tcvdb"
  # tcvdb:
  #   url: "http://10.0.1.1:80"
  #   username: "root"
  #   apiKey: ""
  #   database: ""
  #   embeddingModel: "bge-large-zh"
  #   timeout: 10000

  embedding:
    provider: "none"               # vector search off by default, BM25 only
    # Example for enabling vector search:
    # provider: "openai"
    # baseUrl: "https://api.openai.com/v1"
    # apiKey: "${TDAI_LLM_API_KEY}"
    # model: "text-embedding-3-small"
    # dimensions: 1536

  bm25:
    enabled: true
    language: "zh"

# -- Skill module (optional, off by default) --
# Skill is an added capability and does not affect the Memory engine above.
# When enabled, skill data is stored under the {baseDir}/skills/ directory.
# Can also be enabled via the environment variable TDAI_SKILL_ENABLED=true.
# skill:
#   enabled: true
#   routing:
#     mode: "bm25"
#     searchTopK: 20        # max number of skills (name+description) injected by the listing interface
#   extraction:
#     enabled: true         # requires a valid llm config
#     maxIterations: 16
#   resources:
#     maxResourceSizeBytes: 5000000
#     allowExecutable: false