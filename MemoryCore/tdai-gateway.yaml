# ============================================================
# TDAI Gateway -- default config (Standalone + Skill)
# ============================================================
# Based on standalone single-node mode, with the Skill module also enabled.
# The Memory engine and Skill module share the same baseDir without interfering with each other:
#   - Memory data: {baseDir}/conversations/, records/, scene_blocks/, persona.md ...
#   - Skill data:  {baseDir}/skills/<name>/SKILL.md + files/
#   - Shared DB:   {baseDir}/vectors.db
#
# Start:
#   export TDAI_LLM_API_KEY="sk-..."           # required
#   export TDAI_LLM_BASE_URL="https://..."     # optional (overrides yaml)
#   export TDAI_LLM_MODEL="gpt-4o-mini"        # optional
#   node --import tsx src/gateway/server.ts
#
# Self-check:
#   curl -s http://127.0.0.1:8420/health | jq
#   curl -s -X POST http://127.0.0.1:8420/v3/skill/list \
#     -H "x-tdai-service-id: default" \
#     -H "Content-Type: application/json" -d '{"team_id":"smoke-team"}'
# ============================================================

deployMode: standalone
stateBackend: "local"

server:
  port: 8420
  host: "127.0.0.1"
  # apiKey: "skill-mvp"   # optional; if unset all v2 interfaces are open by default (local machine only)

data:
  baseDir: "~/.memory-tencentdb/memory-tdai"

# -- LLM (required) --
# provider defaults to "openai", i.e. direct connection; to go through context_proxy (unified auth/billing/observability),
# see tdai-gateway.proxy.yaml or docs/llm-via-proxy.md
llm:
  baseUrl: "https://api.lkeap.cloud.tencent.com/v1"
  apiKey: "${TDAI_LLM_API_KEY}"
  model: "deepseek-v3.2"
  maxTokens: 32000
  timeoutMs: 300000

# -- Memory engine config --
memory:
  promptMode: code

  capture:
    enabled: true

  extraction:
    enabled: true
    enableDedup: true
    maxMemoriesPerSession: 20

  persona:
    triggerEveryN: 50
    maxScenes: 15

  pipeline:
    everyNConversations: 5
    enableWarmup: true
    l1IdleTimeoutSeconds: 600
    l2DelayAfterL1Seconds: 90
    l2MinIntervalSeconds: 900
    l2MaxIntervalSeconds: 3600

  recall:
    enabled: true
    maxResults: 5
    scoreThreshold: 0.3
    strategy: "hybrid"
    timeoutMs: 5000

  # -- Storage backend --
  storeBackend: "sqlite"

  embedding:
    provider: "none"               # vector search off by default, BM25 only
    # Example for enabling vector search:
    # provider: "openai"
    # baseUrl: "https://api.openai.com/v1"
    # apiKey: "${TDAI_LLM_API_KEY}"
    # model: "text-embedding-3-small"
    # dimensions: 1536

  bm25:
    enabled: true
    language: "zh"

# -- Skill module --
# Skill is an extra capability; data is stored under {baseDir}/skills/ and does not affect the Memory engine.
# Set enabled: false or delete this section to turn skill off completely; Memory functionality is not affected at all.
skill:
  enabled: true

  # [Reuse] if storeBackend is unset it inherits memory.storeBackend (here sqlite);
  #        tcvdb needs TCVDB credentials (memory.tcvdb) and automatically degrades to sqlite when missing.
  # storeBackend: "sqlite"
  # [Probe] if contentBackend is unset it auto-probes: with COS credentials (cos.*) -> cos, otherwise -> local.
  # contentBackend: "local"

  routing:
    mode: "bm25"          # bm25 | embedding | hybrid (the latter two require memory.embedding enabled, otherwise degrade to bm25)
    searchTopK: 20        # max number of skills (name+description) injected by the listing interface
    # The following are reserved fields: the resolver has defaults but nothing consumes them at runtime yet; keep the defaults.
    # hybridAlpha: 0.3
    # charBudgetPercent: 0.01
    # fastPathMinNameLength: 4

  extraction:
    enabled: true                 # requires a valid top-level llm config (baseUrl + apiKey)
    maxIterations: 16             # max iteration rounds of Review Agent tool-calling
    # model: "deepseek-v3.2"      # [Reuse] if unset, reuse the top-level llm.model
    # toolCallThreshold: 10       # reserved field, no consumer yet
    # Note: headChars / tailChars are not passed through in the per-instance extractor path of service mode,
    #      so they are not exposed in yaml; to adjust, change the skill-extractor.ts defaults or add passthrough in server.ts.
    queue:
      backend: "local"            # standalone uses an in-process queue; service switches to "redis"
      keyPrefix: "tdai"           # Redis key prefix (redis backend)
      resultTtlSeconds: 86400     # TTL (seconds) of the extraction result hash
      lockTtlMs: 600000           # agent-level lock TTL (milliseconds, 10min)
      maxRetries: 2               # max retries on extraction failure
      retryBackoffsMs: [5000, 15000]  # backoff interval (milliseconds) for each retry
      # [Reuse] service mode reuses the top-level redis shared client; leave redisUrl empty;
      #        when a shared client is detected it automatically switches to redis even if backend=local.
      # redisUrl: "redis://:password@host:6379/0"

  resources:
    maxResourceSizeBytes: 5000000  # ✅ effective: per-resource file size limit (5MB), writes over the limit are rejected
    # The following are unwired fields, removed from the active config:
    #   allowExecutable -- meant as a safety switch for executable resources, but not passed into SkillResourceStore, so it blocks nothing
    #   downloadDir     -- meant as a temp directory for resource landing, but resource reads return from memory; no consumer

  # -- Version cleanup (two dimensions, union; 0=off) --
  # versionTtlDays: 0             # time dimension: days to retain non-head versions
  # maxVersions: 100              # count dimension: upper limit of non-head versions per skill

# -- Observability config (local development) --
observability:
  otel:
    enabled: false                    # local does not connect to Zhiyan; turn off OTel gRPC
  clickhouse:
    enabled: false
  kafka:
    enabled: false
  langfuse:
    enabled: true
    # Production endpoints / credentials are injected from env, to avoid committing plaintext into the repo and image.
    # With empty values core automatically skips langfuse reporting (no fail); for local development export as needed.
    host: "${LANGFUSE_HOST:-}"
    publicKey: "${LANGFUSE_PUBLIC_KEY:-}"
    secretKey: "${LANGFUSE_SECRET_KEY:-}"

# -- Analytics query module (reads ClickHouse telemetry on the Proxy side) --
# Off by default in local development; turn on and point to the proxy CH address when debugging analytics interfaces.
analytics:
  clickhouse:
    enabled: false
    # endpoint: "http://localhost:8123"
    # database: "context_proxy"

# -- Metadata module (v3 store + password pepper; sensitive items ${} injected via .env) --
metadata:
  maxUsersPerInstance: 500
  maxTeamsPerInstance: 100
  store:
    mongoUri: "${TDAI_METADATA_MONGO_URI}"
    mongoDbPrefix: "${TDAI_METADATA_MONGO_DB_PREFIX}"
    mongoTransactions: true
  systemUser:
    memory:
      userId: "${TDAI_MEMORY_SYSTEM_USER_ID}"
      displayName: "${TDAI_MEMORY_SYSTEM_USER_NAME}"
      userKey: "${TDAI_MEMORY_SYSTEM_USER_KEY}"

# -- Task external import config, optional ------------------------
# camelCase key -> env: sources.<id>.<key> => TASK_SOURCE_<UPPERCASE_ID>_<UPPER_SNAKE_KEY>.
taskSource:
  # enabled: "${TASK_SOURCE_ENABLED}"        # enabled source ids, comma-separated; if unset none are enabled
  taiPatUrl: "${TAI_PAT_URL}"              # Taihu token application page (shared by iWiki and TAPD)
  sources:
    tapd:                                  # both items below are required; missing either fails fast
      mcpUrl: "${TASK_SOURCE_TAPD_MCP_URL}"              # MCP gateway endpoint
      siteBaseUrl: "${TASK_SOURCE_TAPD_SITE_BASE_URL}"   # site root, used to build detail page URLs
      personalTokenUrl: "${TASK_SOURCE_TAPD_PERSONAL_TOKEN_URL}"  # TAPD personal token application page
