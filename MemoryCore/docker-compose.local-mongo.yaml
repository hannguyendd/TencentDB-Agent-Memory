# ============================================================
# TencentDB-Agent-Memory -- local Mongo flavor Docker Compose
# ============================================================
# Two containers: atlas-local (mongod + mongot, $search/Lucene BM25) + gateway.
# Difference from docker-compose.local.yaml: that one is the service flavor (Redis + Shark mock),
# while this is the standalone flavor (zero Redis/Shark dependency, in-process pipeline), with the data plane on Mongo.
#
# Start (LLM key borrowed from .env.knowledge-local to avoid committing plaintext):
#   set -a && source ../.env.knowledge-local && set +a   # under memory-tencentdb/
#   docker compose -f docker-compose.local-mongo.yaml up --build -d   # under MemoryCore/
# Health: curl http://localhost:8420/health
# Logs: docker compose -f docker-compose.local-mongo.yaml logs -f memory
#       (you should see "cluster profile: topology=replicaSet mongot=yes")
# Stop: docker compose -f docker-compose.local-mongo.yaml down        (keeps data volumes)
# Wipe: docker compose -f docker-compose.local-mongo.yaml down -v     (deletes data and search indexes together)
# ============================================================

services:
  # -- MongoDB 8.3 + Search (mongot) --
  # Same image as the docker/mongo-search setup, but fully on an internal network (no host port mapping),
  # so it does not interfere with a tdai-mongo-search container that may be running on the host.
  mongo-search:
    image: mongodb/mongodb-atlas-local:8.3
    # hostname must be fixed: the atlas-local runner uses the container hostname to initialize the single-node RS member.
    # If not fixed, compose recreating the container -> hostname changes -> RS config in the volume mismatches -> never a primary.
    hostname: mongo-search
    environment:
      - MONGOT_LOG_FILE=/dev/stderr
      - RUNNER_LOG_FILE=/dev/stderr
    volumes:
      - mongo-db:/data/db
      - mongo-configdb:/data/configdb
      # Must be persisted, otherwise the $search index is lost on restart
      - mongo-mongot:/data/mongot
    healthcheck:
      # ping also succeeds when the RS has no primary -- must wait for isWritablePrimary,
      # otherwise depends_on would let core start before the RS election completes.
      test: ["CMD", "mongosh", "--quiet", "--eval", "if (db.adminCommand('hello').isWritablePrimary === true) process.exit(0); else process.exit(1)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # -- TDAI Memory Gateway (Mongo backend) --
  memory:
    build:
      context: .
      dockerfile: Dockerfile
    image: tencentdb-agent-memory:mongo
    ports:
      - "8420:8420"
    volumes:
      - ./tdai-gateway.local-mongo.yaml:/data/config/tdai-gateway.yaml:ro
      - memory-data:/data/tdai-memory
    environment:
      # -- Storage backend selection (gateway flavor only honors env) --
      - STORE_MODE=mongodb
      - MONGODB_ENDPOINT=mongodb://mongo-search:27017/?directConnection=true
      - MONGODB_DATABASE=tdai_memory
      # -- Metadata also lands in the same Mongo (database name tdai_metadata_<instance>; transactions need a replica set, which atlas-local satisfies) --
      # To keep metadata in the in-container sqlite, just delete the line below.
      - TDAI_METADATA_MONGO_URI=mongodb://mongo-search:27017/?directConnection=true
      # -- Local auth-free (Layer1 off; api_key only serves as the Layer3 admin user_key) --
      - TDAI_GATEWAY_API_KEY=
      # -- LLM (injected from the host environment, see usage in the file header) --
      - TDAI_LLM_API_KEY=${TDAI_LLM_API_KEY:?Please run set -a && source ../.env.knowledge-local && set +a first}
      - TDAI_LLM_BASE_URL=${TDAI_LLM_BASE_URL:-https://tokenhub.tencentmaas.com/v1}
      - TDAI_LLM_MODEL=${TDAI_LLM_MODEL:-deepseek-v4-flash}
    depends_on:
      mongo-search:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8420/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  mongo-db:
  mongo-configdb:
  mongo-mongot:
  memory-data:
